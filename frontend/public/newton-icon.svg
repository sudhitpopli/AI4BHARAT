<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8" />
  <circle cx="50" cy="50" r="10" fill="#38bdf8" opacity="0.2" />
  <!-- Orbits -->
  <ellipse cx="50" cy="50" rx="40" ry="14" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" transform="rotate(0 50 50)" />
  <ellipse cx="50" cy="50" rx="40" ry="14" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" transform="rotate(60 50 50)" />
  <ellipse cx="50" cy="50" rx="40" ry="14" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" transform="rotate(-60 50 50)" />
  <!-- Electrons -->
  <circle cx="90" cy="50" r="3" fill="#38bdf8" opacity="0.9" />
  <circle cx="30" cy="30" r="3" fill="#38bdf8" opacity="0.9" />
  <circle cx="30" cy="70" r="3" fill="#38bdf8" opacity="0.9" />
</svg>
